<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اتصال اینترنت برقرار نیست — هاچ لند</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
  :root{
    --bg:#FAF7F0; --ink:#17140F; --ink-soft:#6B6459;
    --gradient-gold:linear-gradient(135deg,#FFE9A6 0%,#DDA646 45%,#A66921 100%);
    --gradient-dark:linear-gradient(150deg,#231D14 0%,#100D09 55%,#000000 100%);
    --border:#E7DECA;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Vazirmatn','Inter',sans-serif; background:var(--bg); color:var(--ink);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; text-align:center; line-height:1.8;
  }
  .box{ max-width:380px; }
  .icon{
    width:76px; height:76px; margin:0 auto 22px; border-radius:22px;
    background:var(--gradient-dark); display:flex; align-items:center; justify-content:center;
    box-shadow:0 16px 40px rgba(16,13,9,.18);
  }
  .icon svg{ width:32px; height:32px; stroke:#FFE9A6; fill:none; stroke-width:1.6; }
  h1{ font-size:19px; font-weight:800; margin-bottom:10px; }
  p{ font-size:13.5px; color:var(--ink-soft); margin-bottom:26px; }
  button{
    font-family:inherit; font-size:13px; font-weight:700; cursor:pointer;
    padding:12px 26px; border-radius:12px; border:1px solid transparent;
    background:var(--gradient-dark); color:#FFF1CE; box-shadow:0 10px 26px rgba(16,13,9,.24);
  }
  .hint{ margin-top:18px; font-size:11.5px; color:#93897A; }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M1 9a16 16 0 0 1 22 0M5 13a10 10 0 0 1 14 0M8.5 17a5 5 0 0 1 7 0"/><line x1="2" y1="2" x2="22" y2="22"/><circle cx="12" cy="20.5" r="1" fill="#FFE9A6" stroke="none"/></svg>
    </div>
    <h1>اتصال اینترنت برقرار نیست</h1>
    <p>این صفحه هنوز تو کش گوشی/سیستم شما ذخیره نشده، برای همین بدون اینترنت قابل نمایش نیست. وقتی دوباره وصل شدید، امتحان کنید.</p>
    <button onclick="location.reload()">تلاش دوباره</button>
    <div class="hint">هاچ لند</div>
  </div>
</body>
</html>
